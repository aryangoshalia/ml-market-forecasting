# Asset groups are fixed up front and never re-drawn. DEV drives all iteration and
# model selection; VAL is used for sanity checks between phases; TEST is scored once,
# at the end, to estimate generalisation to unseen assets.
#
# Groups are stratified by sector rather than sampled at random so that no group is
# dominated by a single sector, which would confound "unseen asset" with "unseen sector".

benchmark: SPY
volatility_index: "^VIX"

groups:
  dev:
    - AAPL   # tech
    - MSFT
    - CSCO
    - TXN
    - ORCL
    - GOOGL
    - NVDA   # tech, high volatility
    - JPM    # financials
    - BAC
    - AXP
    - JNJ    # healthcare
    - MRK
    - UNH
    - AMZN   # consumer discretionary
    - MCD
    - WMT    # consumer staples
    - KO
    - XOM    # energy
    - CAT    # industrials
    - HON
  val:
    - ADBE
    - QCOM
    - IBM
    - GS
    - SCHW
    - PFE
    - LLY
    - HD
    - PG
    - CVX
    - BA
  test:
    - INTC
    - CRM
    - META
    - MS
    - C
    - ABT
    - AMGN
    - COST
    - NKE
    - NEE
    - TSLA

# Sector ETF proxies. XLC (communication services) only began trading in 2018, so
# names that GICS assigns to that sector are mapped to XLK to keep one continuous
# series across the full sample. This is a documented approximation, not an oversight.
sector_etfs:
  technology: XLK
  financials: XLF
  healthcare: XLV
  consumer_discretionary: XLY
  consumer_staples: XLP
  energy: XLE
  industrials: XLI
  utilities: XLU
  materials: XLB

sector_map:
